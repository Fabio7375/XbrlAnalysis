<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analisi di Bilancio e Valutazione da XBRL - Agentic</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f9f9f9}#base-app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<iframe id="base-app" src="/index.html" title="Analisi XBRL Agentica"></iframe>
<script>
const iframe=document.getElementById('base-app');
iframe.addEventListener('load',()=>{
  const win=iframe.contentWindow;
  const doc=iframe.contentDocument;
  if(!win||!doc)return;

  function sanitizeHtml(html){
    const parsed=new DOMParser().parseFromString('<div id="safe-root">'+html+'</div>','text/html');
    parsed.querySelectorAll('script,iframe,object,embed,link,style').forEach(el=>el.remove());
    parsed.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(attr=>{if(/^on/i.test(attr.name)||/^javascript:/i.test(attr.value))el.removeAttribute(attr.name)}));
    return parsed.getElementById('safe-root').innerHTML;
  }

  async function showConfigStatus(el){
    try{
      const r=await fetch('/api/agent-status');
      const s=await r.json();
      if(!s.openaiConfigured){
        el.innerHTML='<div style="padding:10px;border-radius:6px;background:#fff3cd;color:#7a5b00;margin-top:10px"><strong>OPENAI_API_KEY non configurata su Vercel.</strong></div>';
      }else if(!s.accessConfigured){
        el.innerHTML='<div style="padding:10px;border-radius:6px;background:#fff3cd;color:#7a5b00;margin-top:10px"><strong>APP_AGENT_ACCESS_KEY non configurata su Vercel.</strong></div>';
      }else{
        el.innerHTML='<div style="padding:10px;border-radius:6px;background:#e8f5e9;color:#1b5e20;margin-top:10px"><strong>Agente OpenAI pronto.</strong> Il JSON viene passato automaticamente al backend.</div>';
      }
    }catch(e){el.textContent='';}
  }

  function installAgentUi(){
    const ai=doc.getElementById('ai-container');
    const json=doc.getElementById('json-output');
    if(!ai||!json||!json.value)return;
    if(ai.dataset.agenticInstalled==='1')return;
    ai.dataset.agenticInstalled='1';
    ai.style.display='block';
    ai.innerHTML=`
      <h2>Perizia con Agente OpenAI</h2>
      <div style="padding:16px;border:2px solid #3f51b5;border-radius:8px;background:#eef2ff">
        <p style="margin-top:0"><strong>Automazione attiva:</strong> il JSON generato qui sopra viene inviato direttamente all'agente. Non devi copiarlo e non devi inserire la tua API key nel browser.</p>
        <div class="input-group">
          <label for="agent-access-key">Codice accesso agente</label>
          <input type="password" id="agent-access-key" placeholder="Inserisci APP_AGENT_ACCESS_KEY">
          <span class="helper-text">Serve solo a impedire che altri utenti consumino la tua API OpenAI.</span>
        </div>
        <button id="agent-report-btn" class="btn" style="background:#1a237e">Genera Perizia con Agente OpenAI</button>
        <div id="agent-status"></div>
      </div>
      <div id="agent-report" style="margin-top:20px;background:#fff;border:1px solid #d1d9e6;border-radius:8px;padding:20px;line-height:1.7"></div>`;

    const key=doc.getElementById('agent-access-key');
    const saved=win.sessionStorage.getItem('agentAccessKey');
    if(saved)key.value=saved;
    const status=doc.getElementById('agent-status');
    showConfigStatus(status);

    doc.getElementById('agent-report-btn').addEventListener('click',async()=>{
      const accessKey=key.value.trim();
      const report=doc.getElementById('agent-report');
      const btn=doc.getElementById('agent-report-btn');
      if(!accessKey){report.innerHTML='<p style="color:#c62828"><strong>Inserisci il codice accesso agente.</strong></p>';return;}
      let payload;
      try{payload=JSON.parse(json.value);}catch(e){report.innerHTML='<p style="color:#c62828"><strong>JSON non valido.</strong></p>';return;}
      win.sessionStorage.setItem('agentAccessKey',accessKey);
      btn.disabled=true;btn.textContent='Agente in elaborazione...';
      report.innerHTML='<div class="spinner"></div><p style="text-align:center">Analisi e predisposizione della perizia in corso...</p>';
      try{
        const r=await fetch('/api/perizia',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+accessKey},body:JSON.stringify(payload)});
        const data=await r.json();
        if(!r.ok)throw new Error(data.error||'Errore nella chiamata all’agente');
        report.innerHTML=sanitizeHtml(data.html||'<p>Nessun contenuto restituito.</p>');
      }catch(e){report.innerHTML='<p style="color:#c62828"><strong>'+e.message+'</strong></p>';showConfigStatus(status);}finally{btn.disabled=false;btn.textContent='Genera Perizia con Agente OpenAI';}
    });
  }

  const ai=doc.getElementById('ai-container');
  if(ai){
    const observer=new MutationObserver(()=>{if(ai.dataset.agenticInstalled!=='1')setTimeout(installAgentUi,0)});
    observer.observe(ai,{childList:true,subtree:true,attributes:true});
  }
  doc.addEventListener('click',e=>{if(e.target&&e.target.id==='generate-final-json-btn')setTimeout(installAgentUi,50)},true);
  setInterval(installAgentUi,500);
});
</script>
</body>
</html>
